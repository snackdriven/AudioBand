name: .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout Code

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore src/AudioBand.sln

    - name: Build and Publish App
      run: msbuild src/AudioBand.sln /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile

    - name: Run Unit Tests
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vstest = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -find "**\vstest.console.exe" | Select-Object -First 1
        if (-not $vstest) { throw "vstest.console.exe not found" }
        & $vstest src/AudioBand.Test/bin/Release/AudioBand.Test.dll
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: audioband
        path: src/AudioBandInstaller/bin/Release/AudioBand.msi
